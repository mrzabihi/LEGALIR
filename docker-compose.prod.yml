# ============================================================
# LEGALIR — Production deploy (api.simotech.ai)
# ============================================================
# Single self-contained Next.js frontend (mock API mode — no external
# Postgres/Redis/MinIO required). Mirrors the port the host nginx
# reverse proxy already forwards for this domain.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legalir-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_MODE=mock
      - NEXT_PUBLIC_FEATURE_DOCUMENT_ANALYSIS=true
      - NEXT_PUBLIC_FEATURE_CONTRACT_WORKSPACE=true
      - NEXT_PUBLIC_FEATURE_MEMORY=true
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # The demo JSON "DB" (lib/db.ts, lib/demo-seed.ts) writes real runtime
      # state here — registered users, lawyer profiles, sessions, rewards.
      # Must survive image rebuilds/redeploys, not just container restarts.
      - legalir-data:/app/apps/frontend/.data
    healthcheck:
      # Probe the dedicated liveness route, not `/`. Rendering the landing page
      # dragged the whole RSC tree (and every seed it touches) into a check that
      # runs every 30s, and a client-side error on the page could mark a healthy
      # container as failed. `/api/health` is stateless and returns 200 in
      # milliseconds. See apps/frontend/src/app/api/health/route.ts.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  legalir-data:
