# ============================================================
# LEGALIR — Continuous Integration
# ============================================================
# Runs the same commands `npm run validate` runs locally, split into
# independent jobs so a failure names the broken stage:
#
#   quality — asset references, TypeScript, ESLint (0 errors required)
#   test    — the Vitest suite (unit + route + component)
#   build   — a production `next build`
#
# E2E is NOT part of the required path by default: the specs under
# `apps/frontend/e2e` are a mix of regression tests and screenshot
# generators that assume a long-running dev server with the development
# demo seed. A manually-dispatched `e2e` job runs the two stable public
# smoke specs instead.
#
# Deployment is manual (docker-compose.prod.yml) — this workflow only
# verifies; it never publishes anything.
# ============================================================

name: CI

on:
  push:
    branches: [main, "pr/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      e2e:
        description: "Also run the public Playwright smoke specs"
        type: boolean
        default: false

# A force-push or a rapid follow-up commit cancels the stale run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"
  CI: "true"

jobs:
  quality:
    name: Typecheck, lint & assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Asset references
        run: npm run check:assets

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vitest
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # The canonical origin is only used for metadata/canonical URLs at
          # build time; the real value is supplied per environment on deploy.
          NEXT_PUBLIC_SITE_URL: https://legalir.ir

  e2e:
    name: Playwright smoke (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Playwright's `channel: "chrome"` uses the browser preinstalled on
      # GitHub-hosted runners; its OS dependencies still need to be present.
      - name: Install browser dependencies
        run: npx playwright install-deps chrome

      - name: Run public smoke specs
        working-directory: apps/frontend
        run: npx playwright test e2e/smoke.spec.ts e2e/not-found.spec.ts

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore
