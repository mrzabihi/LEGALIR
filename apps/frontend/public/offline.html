<!doctype html>
<html lang="fa-IR" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#162033" />
    <title>اتصال اینترنت برقرار نیست | لیگالیر</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      :root {
        --navy: #162033;
        --navy-deep: #0f172a;
        --gold: #b08d57;
        --ivory: #fff9f0;
        --muted: rgba(255, 249, 240, 0.72);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-top: calc(24px + env(safe-area-inset-top, 0px));
        padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
        font-family: Vazirmatn, "Segoe UI", Tahoma, system-ui, sans-serif;
        color: var(--ivory);
        background:
          radial-gradient(circle at 80% 0%, rgba(176, 141, 87, 0.18), transparent 55%),
          linear-gradient(160deg, var(--navy) 0%, var(--navy-deep) 100%);
      }
      .card {
        width: 100%;
        max-width: 420px;
        text-align: center;
        background: rgba(255, 249, 240, 0.06);
        border: 1px solid rgba(255, 248, 238, 0.14);
        border-radius: 24px;
        padding: 40px 28px;
        backdrop-filter: blur(12px);
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        margin: 0 auto 20px;
        display: block;
      }
      .icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        color: var(--gold);
      }
      h1 {
        font-size: 20px;
        font-weight: 700;
        margin: 0 0 10px;
      }
      p {
        font-size: 15px;
        line-height: 1.9;
        color: var(--muted);
        margin: 0 0 24px;
      }
      button {
        font: inherit;
        font-weight: 600;
        color: var(--navy);
        background: var(--gold);
        border: 0;
        border-radius: 14px;
        padding: 12px 28px;
        cursor: pointer;
        transition: filter 0.15s ease;
      }
      button:hover {
        filter: brightness(1.06);
      }
      button:focus-visible {
        outline: 2px solid var(--ivory);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="logo" src="/icon-192.png" alt="لیگالیر" width="72" height="72" />
      <svg
        class="icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M2 8.5a15 15 0 0120 0" />
        <path d="M5 12a10 10 0 0114 0" />
        <path d="M8.5 15.5a5 5 0 017 0" />
        <circle cx="12" cy="19" r="1.2" fill="currentColor" stroke="none" />
        <path d="M3 3l18 18" />
      </svg>
      <h1>اتصال اینترنت برقرار نیست</h1>
      <p>برای استفاده از خدمات لیگالیر دوباره متصل شوید.</p>
      <button type="button" onclick="location.reload()">تلاش دوباره</button>
    </main>
  </body>
</html>
